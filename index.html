<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Мой Кликер</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #fff);
        color: var(--tg-theme-text-color, #000);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden; /* Чтобы не было скролла */
      }
      h1 { margin-bottom: 20px; }
      #score {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 40px;
        color: var(--tg-theme-button-color, #2481cc);
      }
      button {
        padding: 20px 40px;
        font-size: 1.2rem;
        background-color: var(--tg-theme-button-color, #2481cc);
        color: var(--tg-theme-button-text-color, #fff);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>
    <h1>Кликер</h1>
    <div id="score">0</div>
    <button id="click-btn">Клик!</button>

    <script>
      // 1. Инициализация Telegram WebApp
      const tg = window.Telegram.WebApp;
      tg.ready();
      
      // Растягиваем приложение на весь экран (важно для UX)
      tg.expand();

      // 2. Находим элементы
      const scoreElement = document.getElementById('score');
      const clickBtn = document.getElementById('click-btn');

      // 3. Загружаем счёт из localStorage
      // Если там пусто, ставим 0. parseInt нужен, чтобы превратить строку в число.
      let score = localStorage.getItem('clicker_score') || 0;
      score = parseInt(score, 10);

      // 4. Отображаем текущий счёт
      scoreElement.innerText = score;

      // 5. Функция клика
      function incrementScore() {
        score++;
        scoreElement.innerText = score;
        
        // 6. Сохраняем в localStorage
        localStorage.setItem('clicker_score', score);
        
        // 7. (Опционально) Обновляем текст на главной кнопке Telegram (если настроена)
        // tg.MainButton.setText(`Счёт: \${score}`); 
      }

      // 8. Вешаем событие на кнопку
      clickBtn.addEventListener('click', incrementScore);
    </script>
  </body>
</html>
