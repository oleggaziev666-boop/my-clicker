<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Защита башни</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg-color: var(--tg-theme-bg-color, #121212);
        --text-color: var(--tg-theme-text-color, #ffffff);
        --hint-color: var(--tg-theme-hint-color, #aaaaaa);
        --btn-color: var(--tg-theme-button-color, #03a9f4);
        --danger-color: #ff5252;
        --secondary-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
        --border-radius: 12px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        overflow-x: hidden;
      }

      h1 { margin: 0 0 10px 0; text-align: center; font-weight: 600; }

      .stats-row {
        display: flex;
        gap: 16px;
        width: 100%;
        max-width: 320px;
        justify-content: space-between;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
      }

      .stat-box {
        text-align: center;
      }
      .stat-label { font-size: 0.85rem; color: var(--hint-color); }
      .stat-value { font-size: 1.4rem; font-weight: 700; }
      .hp-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        margin-top: 6px;
        overflow: hidden;
      }
      #hp-bar {
        height: 100%;
        background: var(--danger-color);
        width: 100%;
        transition: width 0.3s, background 0.3s;
      }

      #wave-info {
        text-align: center;
        font-size: 1.1rem;
        margin-bottom: 24px;
        color: var(--hint-color);
      }

      .action-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        max-width: 320px;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: var(--border-radius);
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        transition: transform 0.05s, box-shadow 0.2s;
        display: block;
        text-align: center;
      }

      button:active { transform: scale(0.96); }

      .btn-attack { background: #ff5252; color: white; }
      .btn-repair { background: var(--btn-color); color: var(--bg-color); }

      .floating-text {
        position: absolute;
        pointer-events: none;
        user-select: none;
        font-weight: 700;
        will-change: transform, opacity;
      }

      .game-over-screen {
        display: none;
        text-align: center;
        padding: 20px;
        background: var(--secondary-bg);
        border-radius: var(--border-radius);
      }
      .score-final { font-size: 2rem; font-weight: 800; color: var(--btn-color); margin: 16px 0; }
    </style>
  </head>
  <body>
    <h1>Защита башни</h1>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Волна</div>
        <div class="stat-value" id="wave-num">1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Урон за удар</div>
        <div class="stat-value" id="dmg-per-hit">5</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Ремонт за ход</div>
        <div class="stat-value" id="repair-per-turn">10</div>
      </div>
    </div>

    <div style="width:100%; max-width:320px;">
      <div class="stat-label" style="margin-bottom:4px;">Здоровье башни</div>
      <div class="hp-bar-container"><div id="hp-bar"></div></div>
    </div>

    <div id="wave-info">Следующая волна: 25 монстров</div>
