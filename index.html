<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Кликер: Простая анимация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg-color: var(--tg-theme-bg-color, #121212);
        --text-color: var(--tg-theme-text-color, #ffffff);
        --hint-color: var(--tg-theme-hint-color, #aaaaaa);
        --btn-color: var(--tg-theme-button-color, #03a9f4);
        --secondary-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
        --border-radius: 12px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        overflow-x: hidden;
        position: relative;
      }

      h1 { 
        margin: 0 0 10px 0; 
        text-align: center; 
        font-weight: 600;
      }
      
      .stats {
        text-align: center;
        font-size: 1rem;
        margin-bottom: 24px;
        color: var(--hint-color);
        background: var(--secondary-bg);
        padding: 12px;
        border-radius: var(--border-radius);
        width: 100%;
        max-width: 320px;
      }

      #score {
        font-size: 3.8rem;
        font-weight: 800;
        color: var(--btn-color);
        margin-bottom: 32px;
        word-break: break-all;
        text-shadow: 0 0 10px rgba(3, 169, 244, 0.4);
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: var(--border-radius);
        padding: 16px 24px;
        font-size: 1.1rem;
        font-weight: 600;
        transition: transform 0.05s, box-shadow 0.2s, background-color 0.2s;
        display: block;
        width: 100%;
        max-width: 320px;
        text-align: center;
      }

      button:active { 
        transform: scale(0.96); 
      }

      button:disabled { 
        opacity: 0.4; 
        cursor: not-allowed; 
        filter: grayscale(1);
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        width: 100%;
        max-width: 320px;
      }

      .tab-btn {
        flex: 1;
        padding: 12px 0;
        background: var(--secondary-bg);
        color: var(--hint-color);
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s;
      }

      .tab-btn.active {
        background: var(--btn-color);
        color: var(--bg-color);
        box-shadow: 0 4px 12px rgba(3, 169, 244, 0.3);
      }

      .shop-container {
        width: 100%;
        max-width: 320px;
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      .shop-container.active {
        display: flex;
      }

      .shop-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px;
        background: var(--secondary-bg);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .shop-item:active {
        transform: scale(0.98);
        background: #2a2a35;
      }

      .shop-item.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(1);
      }

      .item-info {
        display: flex;
        flex-direction: column;
        line-height: 1.3;
      }

      .item-name {
        font-weight: 700;
        color: var(--text-color);
      }

      .item-desc {
        font-size: 0.85rem;
        color: var(--hint-color);
      }

      .price {
        font-weight: 800;
        color: var(--btn-color);
        min-width: 50px;
        text-align: right;
      }

      .floating-number {
        position: absolute;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--btn-color);
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        pointer-events: none;
        user-select: none;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <h1>Кликер</h1>

    <div class="stats">
      Сила клика: <span id="power">1</span> | Авто: <span id="auto">0</span>/сек
    </div>

    <div id="score">0</div>

    <button id="click-btn">КЛИК</button>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('click')">Клик</button>
      <button class="tab-btn" onclick="switchTab('auto')">Автофарм</button>
    </div>

    <div id="shop-click" class="shop-container active">
      <div class="shop-item" id="item-power" onclick="buyUpgrade('power')">
        <div class="item-info">
          <span class="item-name">+1 к силе клика</span>
          <span class="item-desc">Увеличивает урон за нажатие</span>
        </div>
        <span class="price" id="price-power">10</span>
      </div>
    </div>

    <div id="shop-auto" class="shop-container">
      <div class="shop-item" id="item-auto" onclick="buyUpgrade('auto')">
        <div class="item-info">
          <span class="item-name">+1 авто-клик/сек</span>
          <span class="item-desc">Пассивный доход без кликов</span>
        </div>
        <span class="price" id="price-auto">50</span>
      </div>
    </div>

    <script>
      // 1. Безопасная инициализация Telegram WebApp
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // 2. Безопасное чтение localStorage (защита от ошибок)
      function getSafeInt(key, defaultValue) {
        try {
          const val = localStorage.getItem(key);
          const num = parseInt(val, 10);
          return isNaN(num) ? defaultValue : num;
        } catch (e) {
          return defaultValue;
        }
      }

      let score = getSafeInt('clicker_score', 0);
      let power = getSafeInt('clicker_power', 1);
      let auto = getSafeInt('clicker_auto', 0);

      const basePricePower = 10;
      const basePriceAuto = 50;

      const scoreEl = document.getElementById('score');
      const powerEl = document.getElementById('power');
      const autoEl = document.getElementById('auto');
      const clickBtn = document.getElementById('click-btn');
      
      const pricePowerEl = document.getElementById('price-power');
      const priceAutoEl = document.getElementById('price-auto');
      const itemPowerEl = document.getElementById('item-power');
      const itemAutoEl = document.getElementById('item-auto');

      function showFloatingNumber(value) {
        if (!clickBtn) return;
        const el = document.createElement('div');
        el.className = 'floating-number';
        el.innerText = '+' + value;

        const btnRect = clickBtn.getBoundingClientRect();
        const startX = btnRect.left + btnRect.width / 2 - 20;
        const startY = btnRect.top - 40;

        el.style.left = startX + 'px';
        el.style.top = startY + 'px';
        document.body.appendChild(el);

        const duration = 800;
        const moveUp = 120;
        const startTime = performance.now();

        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 2);

          const currentY = startY - moveUp * ease;
          const currentOpacity = 1 - ease;

          el.style.transform = `translateY(\${currentY - startY}px)`;
          el.style.opacity = currentOpacity;

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            el.remove();
          }
        }
        requestAnimationFrame(animate);
      }

      function save() {
        try {
          localStorage.setItem('clicker_score', Math.floor(score));
          localStorage.setItem('clicker_power', Math.floor(power));
          localStorage.setItem('clicker_auto', Math.floor(auto));
        } catch (e) {
          // Если localStorage недоступен (например, в приватном режиме), просто игнорируем
        }
      }

      function toInt(num) {
        return Math.max(0, Math.floor(num));
      }

      function updateUI() {
        scoreEl.innerText = toInt(score);
        powerEl.innerText = toInt(power);
        autoEl.innerText = toInt(auto);

        // Считаем цену от ТЕКУЩИХ значений переменных, а не из localStorage
        const nextPowerPriceRaw = basePricePower * Math.pow(1.5, power);
        const nextAutoPriceRaw = basePriceAuto * Math.pow(1.5, auto);

        const displayPowerPrice = toInt(nextPowerPriceRaw);
        const displayAutoPrice = toInt(nextAutoPriceRaw);

        pricePowerEl.innerText = displayPowerPrice;
        priceAutoEl.innerText = displayAutoPrice;

        const canBuyPower = score >= displayPowerPrice;
        const canBuyAuto = score >= displayAutoPrice;

        itemPowerEl.classList.toggle('disabled', !canBuyPower);
        itemAutoEl.classList.toggle('disabled', !canBuyAuto);

        // Обновляем обработчики клика только если покупка доступна
        itemPowerEl.onclick = canBuyPower ? () => buyUpgrade('power') : null;
        itemAutoEl.onclick = canBuyAuto ? () => buyUpgrade('auto') : null;
      }

      function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.shop-container').forEach(cont => cont.classList.remove('active'));

        if (tabName === 'click') {
          document.querySelector('.tabs button:nth-child(1)').classList.add('active');
          document.getElementById('shop-click').classList.add('active');
        } else {
          document.querySelector('.tabs button:nth-child(2)').classList.add('active');
          document.getElementById('shop-auto').classList.add('active');
        }
      }

      if (clickBtn) {
        clickBtn.addEventListener('click', () => {
          const gain = power;
          score += gain;
          save();
          updateUI();

          showFloatingNumber(gain);

          if (navigator.vibrate) navigator.vibrate(20);
        });
      }

      setInterval(() => {
        if (auto > 0) {
          score += auto;
          save();
          updateUI();
        }
      }, 1000);

      function buyUpgrade(type) {
        // Используем локальные переменные power и auto, а не читаем заново из localStorage
        if (type === 'power') {
          const cost = toInt(basePricePower * Math.pow(1.5, power));
          if (score >= cost) {
            score -= cost;
            power++;
            save();
            updateUI();
          }
        } else if (type === 'auto') {
          const cost = toInt(basePriceAuto * Math.pow(1.5, auto));
          if (score >= cost) {
            score -= cost;
            auto++;
            save();
            updateUI();
          }
        }
      }

      updateUI();
    </script>
  </body>
</html>
