<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Crypto Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg-color: var(--tg-theme-bg-color, #121212);
        --text-color: var(--tg-theme-text-color, #ffffff);
        --hint-color: var(--tg-theme-hint-color, #aaaaaa);
        --btn-color: var(--tg-theme-button-color, #03a9f4);
        --secondary-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
        --border-radius: 12px;
        --nav-height: 60px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        overflow-x: hidden;
        position: relative;
      }

      /* --- Основной экран (Игровой) --- */
      #main-screen { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; }
      #shop-screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }

      h1 { margin: 0 0 10px 0; text-align: center; font-weight: 600; }
      
      .stats {
        text-align: center; font-size: 1rem; margin-bottom: 24px; color: var(--hint-color);
        background: var(--secondary-bg); padding: 12px; border-radius: var(--border-radius);
        width: 100%; max-width: 320px;
      }

      #score {
        font-size: 3.8rem; font-weight: 800; color: var(--btn-color);
        margin-bottom: 32px; word-break: break-all;
        text-shadow: 0 0 10px rgba(3, 169, 244, 0.4);
      }

      /* --- МОНЕТА (Вместо кнопки) --- */
      #coin-btn {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        transition: transform 0.05s, box-shadow 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, #e0e0e0 0%, #b0b0b0 100%);
        border: 4px solid #fff;
      }

      /* Эффект нажатия (сжатие) */
      #coin-btn:active {
        transform: scale(0.92);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }

      /* Стилизация картинки монеты (если вдруг картинка не загрузится) */
      #coin-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      }

      /* --- Навигация (Нижняя панель) --- */
      .bottom-nav {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 320px; display: flex; gap: 12px; z-index: 100;
      }
      .nav-btn {
        flex: 1; background: var(--secondary-bg); color: var(--hint-color);
        border-radius: 12px; padding: 12px 0; font-weight: 600; font-size: 0.9rem;
        transition: all 0.2s;
      }
      .nav-btn.active {
        background: var(--btn-color); color: var(--bg-color);
        box-shadow: 0 4px 12px rgba(3, 169, 244, 0.3);
      }

      /* --- Магазин (Карточки товаров) --- */
      .shop-grid {
        width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; margin-top: 20px;
      }
      .shop-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px; background: var(--secondary-bg);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2); border-radius: 8px;
        cursor: pointer; transition: all 0.2s;
      }
      .shop-item:active { transform: scale(0.98); background: #2a2a35; }
      .shop-item.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

      .item-info { display: flex; flex-direction: column; line-height: 1.3; }
      .item-name { font-weight: 700; color: var(--text-color); }
      .item-desc { font-size: 0.85rem; color: var(--hint-color); }
      .price { font-weight: 800; color: var(--btn-color); min-width: 50px; text-align: right; }

      /* --- Анимация всплывающих чисел --- */
      .floating-number {
        position: absolute; font-size: 1.8rem; font-weight: 700; color: var(--btn-color);
        text-shadow: 0 2px 4px rgba(0,0,0,0.3); pointer-events: none; user-select: none;
        will-change: transform, opacity; z-index: 10;
      }
    </style>
  </head>
  <body>

    <!-- ЭКРАН ИГРЫ -->
    <div id="main-screen">
      <h1>Crypto Clicker</h1>
      <div class="stats">
        Сила клика: <span id="power">1</span> | Авто: <span id="auto">0</span>/сек
      </div>
      <div id="score">0</div>
      
      <!-- КНОПКА-МОНЕТА -->
      <div id="coin-btn" onclick="handleClick()">
        <!-- Сюда можно вставить свою картинку, если есть файл -->
        <!-- <img src="white-coin.png" alt="Coin"> -->
        
        <!-- Если картинки нет, здесь будет просто стилизованная монета с буквой W -->
        <div style="font-size: 100px; font-weight: 900; color: #333; line-height: 1; text-shadow: 0 2px 4px rgba(255,255,255,0.3);">W</div>
      </div>
      
      <!-- Нижняя панель навигации -->
      <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchScreen('game')">Главная</button>
        <button class="nav-btn" onclick="switchScreen('shop')">Маркет</button>
      </div>
    </div>

    <!-- ЭКРАН МАГАЗИНА -->
    <div id="shop-screen">
      <h1 style="margin-top: 40px;">Маркет</h1>
      <div class="stats">
        Ваш баланс: <span id="shop-score">0</span>
      </div>
      <div class="shop-grid">
        <div class="shop-item" id="item-power" onclick="buyUpgrade('power')">
          <div class="item-info">
            <span class="item-name">+1 к силе клика</span>
            <span class="item-desc">Больше монет за одно нажатие</span>
          </div>
          <span class="price" id="price-power">10</span>
        </div>
        <div class="shop-item" id="item-auto" onclick="buyUpgrade('auto')">
          <div class="item-info">
          <span class="item-name">+1 авто-клик/сек</span>
          <span class="item-desc">Пассивный доход без участия</span>
          </div>
          <span class="price" id="price-auto">50</span>
        </div>
      </div>
      <button class="nav-btn" style="margin-top: 20px; background: var(--secondary-bg);" onclick="switchScreen('game')">Назад в игру</button>
    </div>

    <script>
      // 1. Инициализация Telegram
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // 2. Загрузка данных
      function getSafeInt(key, defaultValue) {
        try {
          const val = localStorage.getItem(key);
          const num = parseInt(val, 10);
          return isNaN(num) ? defaultValue : num;
        } catch (e) {
          return defaultValue;
        }
      }

      let score = getSafeInt('clicker_score', 0);
      let power = getSafeInt('clicker_power', 1);
      let auto = getSafeInt('clicker_auto', 0);

      const basePricePower = 10;
      const basePriceAuto = 50;

      // Элементы DOM
      const scoreEl = document.getElementById('score');
      const shopScoreEl = document.getElementById('shop-score');
      const powerEl = document.getElementById('power');
      const autoEl = document.getElementById('auto');
      const coinBtn = document.getElementById('coin-btn');
      const pricePowerEl = document.getElementById('price-power');
      const priceAutoEl = document.getElementById('price-auto');
      const itemPowerEl = document.getElementById('item-power');
      const itemAutoEl = document.getElementById('item-auto');

      // --- Логика анимации чисел (теперь привязана к монете) ---
      function showFloatingNumber(value) {
        if (!coinBtn) return;
        const el = document.createElement('div');
        el.className = 'floating-number';
        el.innerText = '+' + value;

        const btnRect = coinBtn.getBoundingClientRect();
        // Центрируем всплывающее число над монетой
        const startX = btnRect.left + btnRect.width / 2 - 20;
        const startY = btnRect.top - 40;

        el.style.left = startX + 'px';
        el.style.top = startY + 'px';
        document.body.appendChild(el);

        const duration = 800;
        const moveUp = 140;
        const startTime = performance.now();

        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 2);

          const currentY = startY - moveUp * ease;
          const currentOpacity = 1 - ease;

          el.style.transform = `translateY(\${currentY - startY}px)`;
          el.style.opacity = currentOpacity;

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            el.remove();
          }
        }
        requestAnimationFrame(animate);
      }

      // --- Обработчик клика по монете ---
      function handleClick() {
        const gain = power;
        score += gain;
        save();
        updateUI();
        showFloatingNumber(gain);
        if (navigator.vibrate) navigator.vibrate(20);
      }

      // --- Сохранение ---
      function save() {
        try {
          localStorage.setItem('clicker_score', Math.floor(score));
          localStorage.setItem('clicker_power', Math.floor(power));
          localStorage.setItem('clicker_auto', Math.floor(auto));
        } catch (e) {}
      }

      function toInt(num) {
        return Math.max(0, Math.floor(num));
      }

      // --- Обновление интерфейса ---
      function updateUI() {
        scoreEl.innerText = toInt(score);
        shopScoreEl.innerText = toInt(score);
        powerEl.innerText = toInt(power);
        autoEl.innerText = toInt(auto);

        const nextPowerPriceRaw = basePricePower * Math.pow(1.5, power);
        const nextAutoPriceRaw = basePriceAuto * Math.pow(1.5, auto);

        const displayPowerPrice = toInt(nextPowerPriceRaw);
        const displayAutoPrice = toInt(nextAutoPriceRaw);

        pricePowerEl.innerText = displayPowerPrice;
        priceAutoEl.innerText = displayAutoPrice;

        const canBuyPower = score >= displayPowerPrice;
        const canBuyAuto = score >= displayAutoPrice;

        itemPowerEl.classList.toggle('disabled', !canBuyPower);
        itemAutoEl.classList.toggle('disabled', !canBuyAuto);

        itemPowerEl.onclick = canBuyPower ? () => buyUpgrade('power') : null;
        itemAutoEl.onclick = canBuyAuto ? () => buyUpgrade('auto') : null;
      }

      // --- Переключение экранов ---
      function switchScreen(screenName) {
        const mainScreen = document.getElementById('main-screen');
        const shopScreen = document.getElementById('shop-screen');
        const navBtns = document.querySelectorAll('.nav-btn');

        if (screenName === 'game') {
          mainScreen.style.display = 'flex';
          shopScreen.style.display = 'none';
          navBtns.classList.add('active');
          navBtns.classList.remove('active');
        } else {
          mainScreen.style.display = 'none';
          shopScreen.style.display = 'flex';
          navBtns.classList.remove('active');
          navBtns.classList.add('active');
        }
      }

      // Автофарм
      setInterval(() => {
        if (auto > 0) {
          score += auto;
          save();
          updateUI();
        }
      }, 1000);

      // Покупка
      function buyUpgrade(type) {
        if (type === 'power') {
          const cost = toInt(basePricePower * Math.pow(1.5, power));
          if (score >= cost) {
            score -= cost;
            power++;
            save();
            updateUI();
          }
        } else if (type === 'auto') {
          const cost = toInt(basePriceAuto * Math.pow(1.5, auto));
          if (score >= cost) {
            score -= cost;
            auto++;
            save();
            updateUI();
          }
        }
      }

      updateUI();
    </script>
  </body>
</html>
